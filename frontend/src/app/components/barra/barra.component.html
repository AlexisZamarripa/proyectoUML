<aside class="barra">
  <nav class="barra-nav">
    <ng-container *ngFor="let item of topItems">
      <ng-container *ngTemplateOutlet="navItemTemplate; context: { $implicit: item, indented: false }"></ng-container>
    </ng-container>

    <section class="nav-section" *ngFor="let section of navSections">
      <div class="nav-section-header">
        <span class="nav-section-label">{{ section.label }}</span>
      </div>

      <div class="section-items">
        <ng-container *ngFor="let item of section.items">
          <ng-container *ngTemplateOutlet="navItemTemplate; context: { $implicit: item, indented: true }"></ng-container>
        </ng-container>
      </div>
    </section>
  </nav>
</aside>

<ng-template #navItemTemplate let-item let-indented="indented">
  <a
    class="nav-item"
    [class.nav-item-indented]="indented"
    [class.active]="activeTab === item.id"
    [attr.href]="item.route"
    (click)="navigate(item.route, $event)"
  >
    <!-- Stakeholders / Users -->
    <svg *ngIf="item.icon === 'users'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
    <!-- Grid / Procesos -->
    <svg *ngIf="item.icon === 'grid'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
    </svg>
    <!-- File / Entrevistas -->
    <svg *ngIf="item.icon === 'file'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
    </svg>
    <!-- Clipboard / Encuestas -->
    <svg *ngIf="item.icon === 'clipboard'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
    </svg>
    <!-- Eye / Observaciones -->
    <svg *ngIf="item.icon === 'eye'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    <!-- Users Group / Focus Groups -->
    <svg *ngIf="item.icon === 'users-group'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
    <!-- Book / Historias -->
    <svg *ngIf="item.icon === 'book'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
    </svg>
    <!-- Folder / Documentos -->
    <svg *ngIf="item.icon === 'folder'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
    </svg>
    <!-- Trending / Seguimiento -->
    <svg *ngIf="item.icon === 'trending'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
      <polyline points="17 6 23 6 23 12"></polyline>
    </svg>
    <!-- Diagramas -->
    <svg *ngIf="item.icon === 'diagram'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="5" r="2"></circle>
      <circle cx="5" cy="19" r="2"></circle>
      <circle cx="19" cy="12" r="2"></circle>
      <line x1="7" y1="5" x2="13" y2="10"></line>
      <line x1="7" y1="19" x2="13" y2="14"></line>
      <line x1="13" y1="10" x2="17" y2="12"></line>
      <line x1="13" y1="14" x2="17" y2="12"></line>
    </svg>

    <span class="nav-label">{{ item.label }}</span>
  </a>
</ng-template>
